<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLSN Insights · Lunar Landing Site Navigator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/inicio.css" />
  </head>
  <body class="pagina-mision">
    <!-- Fondo de estrellas (se dibuja con js/inicio.js) -->
    <canvas id="estrellas" aria-hidden="true"></canvas>

    <!-- Modelo 3D de la Luna (lo pone aquí js/luna3d.js) -->
    <div id="luna-3d" aria-hidden="true"></div>

    <main class="tarjeta tarjeta-mision">
      <h1>Welcome to <strong>LLSN Insights</strong>!</h1>
      <p class="subtitulo">Please answer the following for getting started!</p>
      <form class="datos-entrada" id="formulario-coordenadas">
        <label for="centro-lanzamiento">Select the <strong>launching center</strong></label>
        <select id="centro-lanzamiento" class="selector-mision" name="centro-lanzamiento" required>
          <option value="" selected disabled>Choose a launching center</option>
          <option value="opcion-1">Kennedy Space Center</option>
          <option value="opcion-2">Cape Canaveral Space Force Station</option>
          <option value="opcion-3">Vandenberg Space Force Base</option>
          <option value="opcion-4">Wallops Flight Facility</option>
          <option value="opcion-5">Reagan Test Site Kwajalein Atoll</option>
          <option value="opcion-6">Rocket Labs Launch Complex</option>
          <option value="opcion-7">SpaceXs Starbase</option>
        </select>

        <div class="campos-fecha-hora">
          <div class="campo-mision">
            <label for="fecha-mision">Enter the <strong>date</strong></label>
            <input id="fecha-mision" name="fecha-mision" type="date" required />
          </div>
          <div class="campo-mision">
            <label for="hora-mision">Enter the <strong>hour</strong></label>
            <input id="hora-mision" name="hora-mision" type="time" required />
          </div>
        </div>

        <!-- Latitud y longitud: sur y oeste en negativo (ej. -89.5), o con letra (ej. 89.5 S) -->
        <div class="campos-fecha-hora">
          <div class="campo-mision">
            <label for="latitud">Enter <strong>latitude</strong></label>
            <input id="latitud" name="latitud" type="text" inputmode="decimal" placeholder="e.g. -89.5" required />
          </div>
          <div class="campo-mision">
            <label for="longitud">Enter the <strong>longitude</strong></label>
            <input id="longitud" name="longitud" type="text" inputmode="decimal" placeholder="e.g. 45.3" required />
          </div>
        </div>

        <!-- Return: regresa a la página principal. Enter: sigue al siguiente paso (js/enter.js) -->
        <div class="acciones">
          <a class="boton boton-return" href="index.html">Return</a>
          <button type="submit" class="boton boton-enter">Enter</button>
        </div>
      </form>
    </main>

    <script src="js/inicio.js"></script>

    <!-- Luna 3D: estas dos partes se copian igual en cualquier página que quiera la Luna -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="js/luna3d.js"></script>
    <script type="module" src="js/enter.js"></script>
  </body>
</html>
